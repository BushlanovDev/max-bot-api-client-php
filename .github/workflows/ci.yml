name: CI

on: [ push, pull_request ]

jobs:

  phpstan:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - { laravel: "^12.0", guzzle: "^7.0" }
          - { laravel: "^13.0", guzzle: "^7.0" }
          - { laravel: "^13.0", guzzle: "^8.0" }
    name: phpstan / Laravel ${{ matrix.stack.laravel }} / Guzzle ${{ matrix.stack.guzzle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install composer dependencies
        run: composer update --prefer-dist --no-interaction --with "guzzlehttp/guzzle:${{ matrix.stack.guzzle }}" --with "laravel/framework:${{ matrix.stack.laravel }}"

      - name: Run Static Analysis
        run: ./vendor/bin/phpstan analyse -c phpstan.neon --error-format=github

  tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ "8.3", "8.4", "8.5" ]
        stack:
          - { laravel: "^12.0", guzzle: "^7.0" }
          - { laravel: "^13.0", guzzle: "^7.0" }
          - { laravel: "^13.0", guzzle: "^8.0" }
    name: PHP ${{ matrix.php-versions }} / Laravel ${{ matrix.stack.laravel }} / Guzzle ${{ matrix.stack.guzzle }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: xdebug

      - name: Install composer dependencies
        run: composer update --prefer-dist --no-interaction --with "guzzlehttp/guzzle:${{ matrix.stack.guzzle }}" --with "laravel/framework:${{ matrix.stack.laravel }}"

      - name: PHPUnit
        run: ./vendor/bin/phpunit --configuration=phpunit.xml --coverage-text
